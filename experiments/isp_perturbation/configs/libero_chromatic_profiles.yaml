defaults:
  submit_info: submit_info.yaml
  data_root: /path/to/RAW-VLA
  result_root: /path/to/RAW-VLA/results/libero-chromatic-zeroshot
  trials: 50
  suites:
    - libero_spatial
    - libero_object
    - libero_goal
    - libero_10
  gpu_type: NVIDIA-L4
  family: ml.gni3
  priority: 6

profiles:
  qwen3_oft_l4:
    description: "Qwen3-VL-OFT chromatic LIBERO zero-shot; mirrors verified bit-depth L4 resource shape."
    models:
      - Qwen3-VL-OFT-LIBERO-4in1
    code_root: /path/to/RAW-VLA
    gpu_count: 2
    gpu_visible: "0,1"
    cpu: 16
    memory_gib: 96
    env:
      RESULT_ROOT: /path/to/RAW-VLA/results/libero-chromatic-zeroshot
      RAWVLA_FORCE_IMAGE_PYTHON: "1"
      RAWVLA_QWEN_SHARD: "1"
      RAWVLA_QWEN_DEVICE_MAP: balanced_low_0
      RAWVLA_QWEN_MAX_MEMORY: "0:2GiB,1:22GiB"
      RAWVLA_QWEN_ACTION_DEVICE: cuda:0
      RAWVLA_GROUP_RETRIES: "1"
      RAWVLA_GROUP_RETRY_SLEEP: "45"
      RAWVLA_SERVER_CLEANUP_GRACE: "30"
      RAWVLA_EMPTY_CACHE_EACH_STEP: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

