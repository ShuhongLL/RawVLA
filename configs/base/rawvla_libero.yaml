# LIBERO-specific dataset defaults layered on the shared RAW-VLA recipe.
extends: rawvla.yaml

datasets:
  vla_data:
    data_mix: rawvla_light_npz
    cache_root: ${oc.env:RAWVLA_ROOT}/benchmark_data/libero/rawvla_light_train_raw_npz
    observation_stride: 8
    action_horizon: 8
    normalization: starvla_minmax
